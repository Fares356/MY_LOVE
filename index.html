<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جاري تحميل المفاجأة…</title>
  <style>body{font-family:Tahoma,sans-serif;display:grid;place-items:center;min-height:90vh;color:#8a3350;background:#fff1f3}</style>
</head>
<body>
  <p>جاري تحميل المفاجأة… 💞</p>
  <script>
    (function () {
      var sourceUrl = 'https://raw.githubusercontent.com/Fares356/MY_LOVE/b630de5bf0629eedfdda602b84cdd26c96249a10/index.html';
      fetch(sourceUrl)
        .then(function (response) {
          if (!response.ok) throw new Error('تعذر تحميل الصفحة');
          return response.text();
        })
        .then(function (html) {
          var start = html.indexOf('var mq=0,qm=false;');
          var end = html.indexOf('rq();', start);
          if (start < 0 || end < 0) throw new Error('تعذر تحديث الاختبار');

          var quizLogic = `var qn=0,review=[],reviewing=false;
function showQuizQuestion(){
  var box=$('qz');
  if(!reviewing&&qn>=QZ.length){
    if(review.length){reviewing=true;qn=0;}
    else{return finishQuiz();}
  }
  if(reviewing&&qn>=review.length)return finishQuiz();
  var index=reviewing?review[qn]:qn,q=QZ[index];
  box.innerHTML='<div class="qn">'+(reviewing?'مراجعة الإجابات الغلطانة':'سؤال '+(qn+1)+' من '+QZ.length)+'</div><h3>'+q.q+'</h3><div class="wm" id="wm"></div>';
  q.o.forEach(function(option,i){
    var button=document.createElement('button');
    button.className='op';button.textContent=option;
    button.onclick=function(){
      if(i===q.a){
        button.classList.add('ok');
        setTimeout(function(){qn++;showQuizQuestion();},500);
      }else{
        button.classList.add('bad');
        if(reviewing){$('wm').textContent='لسه غلط، جربي تاني 💗';}
        else{
          if(review.indexOf(index)===-1)review.push(index);
          $('wm').textContent='غلط! هنرجع للسؤال ده في آخر الاختبار علشان تصححيه 💡';
          Array.prototype.forEach.call(box.querySelectorAll('.op'),function(answer){answer.disabled=true;});
          setTimeout(function(){qn++;showQuizQuestion();},1000);
        }
      }
    };
    box.appendChild(button);
  });
}
function finishQuiz(){
  var box=$('qz');
  box.innerHTML='<h3>نجحتي 🎉</h3><p>صححتي كل الإجابات الغلطانة، وفتحتي باقي المفاجأة 💞</p>';
  $('quiz').classList.add('done');
  burst(innerWidth/2,innerHeight/2,50);
}
showQuizQuestion();`;
          html = html.slice(0, start) + quizLogic + html.slice(end + 5);
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          document.body.textContent = 'حصلت مشكلة في تحميل الصفحة. حاولي تحديثها.';
        });
    })();
  </script>
</body>
</html>
